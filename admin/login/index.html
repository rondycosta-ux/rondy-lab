<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar | Rondy Lab Admin</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link rel="stylesheet" href="/admin/css/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js" defer></script>
    <script src="/admin/js/supabase-config.js" defer></script>
    <script src="/admin/js/supabase-client.js" defer></script>
    <script src="/admin/js/auth.js" defer></script>
</head>
<body data-auth-page="login">
    <main class="login-page">
        <a class="admin-brand" href="/" aria-label="Rondy Lab — início"><img src="/assets/images/logo.png" alt="Rondy Lab"></a>
        <p class="admin-header__eyebrow">RONDY LAB / ADMIN</p>
        <h1>ENTRAR</h1>
        <p class="login-description">Acesse com seu e-mail e senha para continuar.</p>
        <form id="login-form" method="post">
            <div class="config-field">
                <label for="login-email">E-mail</label>
                <div class="config-field__input-row"><input id="login-email" type="email" autocomplete="username" required maxlength="254"></div>
            </div>
            <div class="config-field">
                <label for="login-password">Senha</label>
                <div class="config-field__input-row"><input id="login-password" type="password" autocomplete="current-password" required></div>
            </div>
            <button id="login-submit" class="admin-button admin-button--primary" type="submit" disabled>ENTRAR</button>
            <p id="auth-status" class="admin-form-message" role="status" aria-live="polite">Preparando acesso…</p>
        </form>
        <noscript><p>Ative o JavaScript para entrar no Admin.</p></noscript>
    </main>
</body>
</html>
