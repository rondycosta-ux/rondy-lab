<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rondy Lab</title>
    <meta name="description" content="Rondy Lab - design e fabricação 3D.">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="index.html" aria-label="Rondy Lab - Início">
                <img src="assets/images/logo.png" alt="Rondy Lab">
            </a>

            <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
                <span class="nav-toggle__bars"></span>
            </button>

            <nav class="site-nav" aria-label="Menu principal">
                <a class="is-active" href="index.html">Home</a>
                <a href="sobre/index.html">Sobre a Rondy Lab</a>
                <a href="catalogo/index.html">Catálogo de Produtos</a>
                <a href="contato/index.html">Contato</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero__content">
                <p class="hero__eyebrow">RONDY LAB • IMPRESSÃO 3D</p>
                <h1 id="hero-title" class="hero__title">
                    IDEIAS GANHAM<br>
                    <span class="hero__title--accent">FORMA.</span>
                </h1>
                <p class="hero__text">
                    Transformamos ideias em objetos, colecionáveis e soluções através da impressão 3D.
                </p>

                <div class="hero__actions">
                    <a class="btn btn--primary" href="/catalogo/">CONHEÇA NOSSOS PRODUTOS</a>
                    <a class="btn btn--secondary" href="/sobre/">SOBRE A RONDY LAB</a>
                </div>
            </div>

            <div class="hero__visual" aria-hidden="true">
                <img class="hero__image" src="assets/images/hero-products.png" alt="" loading="eager" />
            </div>
        </section>
    </main>
</body>
</html>
